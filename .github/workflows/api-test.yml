
name: GoRest API Tests

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  api-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Newman
        run: npm install -g newman

      - name: Run GoRest API Collection
        run: |
          newman run 2373401012853_ChuThuanThanh_GoRest.postman_collection.json \
            -e 2373401012853_ChuThuanThanh_GoRest_Env.postman_environment.json \
            -d users.csv \
            --env-var "token=${{ secrets.GOREST_TOKEN }}"
